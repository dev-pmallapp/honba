name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  rust-checks:
    name: Rust (Format, Clippy & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust Workspace Tests
        run: cargo test --workspace --verbose

  python-checks:
    name: Python (Ruff & Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Create Virtualenv and Install Dependencies
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install ruff pytest pytest-asyncio maturin import-linter \
            numpy pandas polars pydantic fastapi httpx typer rich

      - name: Lint with Ruff
        run: ruff check python/

      - name: Build Rust Extension with Maturin
        run: maturin develop --release --skip-install

      - name: Check Import Contracts
        run: make lint-imports

      - name: Run Pytest
        run: pytest tests/
