<!DOCTYPE html>
<html lang="en" data-theme="honba-dark" data-typography="inter-mono" data-layout="default">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Honba (相場) Screener — Multi-Market Quantitative Stock Scanner with Indian Securities (NSE/BSE), US, Japan, and UK support, customizable TradingView look-and-feel, and live ticks." />
  <title>Honba (相場) Screener — Multi-Market Quantitative Stock Scanner</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>相</text></svg>" />
</head>
<body>
  <div id="app">
    <!-- Top Navigation with App Switcher & Market Selector -->
    <div id="app-nav-container"></div>

    <!-- Main Workspace Container -->
    <div class="app-content">
      <!-- Filter Bar with Category Tabs, Search, and Knobs -->
      <div id="filter-bar-container"></div>

      <!-- Screener Table Full Workspace -->
      <div class="workspace-container" id="workspace-container">
        <div class="table-panel" id="table-panel">
          <div class="screener-table-container" id="table-scroll-container"></div>
        </div>
      </div>
    </div>

    <!-- Floating Bulk Selection Action Bar -->
    <div id="floating-action-bar" class="shortlist-action-bar"></div>
  </div>

  <script type="module" src="/src/screener.ts"></script>
</body>
</html>
