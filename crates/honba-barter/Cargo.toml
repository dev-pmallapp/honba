[package]
name = "honba-barter"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
barter = { workspace = true }
barter-data = { workspace = true }
barter-execution = { workspace = true }
barter-instrument = { workspace = true }
honba-core = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# `test-util` enables a paused (virtual) clock: the mock exchange simulates latency with
# `tokio::time::sleep`, which would otherwise cost real wall-clock time per order.
tokio = { workspace = true, features = ["test-util"] }
futures-util = { workspace = true }
smol_str = "0.3"

[dev-dependencies]
rust_decimal = { workspace = true, features = ["macros"] }
