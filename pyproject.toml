[project]
name = "honba"
version = "0.1.0"
description = "honba — systemic market research platform for Indian securities"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "LGPL-3.0-only" }
authors = [
    { name = "honba contributors" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "httpx>=0.28",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "pandas>=2",
    "polars>=1",
    "pydantic>=2",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "pyarrow>=17",
    "scikit-learn>=1.6",
    "xgboost>=2",
    "lightgbm>=4",
    "PyPortfolioOpt>=1.5",
    "hmmlearn>=0.3",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
ml = [
    "optuna>=4",
    "catboost>=1",
]
jupyter = [
    "jupyterlab>=4",
    "ipykernel>=6",
    "matplotlib>=3.10",
    "seaborn>=0.13",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4",
    "ipdb>=0.13",
    "import-linter>=2.1",
]
docs = [
    "mkdocs-material>=9.5",
]
keyring = [
    "keyring>=25",
]
mcp = [
    "mcp>=1.2",
]

[project.scripts]
honba-mcp = "honba.mcp.server:main"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "C4", "SIM", "RUF"]
# Property-style docstrings ("True when ...") and dunder methods read better without D401/D105/D107.
ignore = ["D105", "D107", "D401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["python"]
python_files = "test_*.py"
addopts = "-v --tb=short --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The compiled barter engine (``honba._core``) is built with ``maturin develop`` (see the
# README); ``python-source`` makes it land next to the pure-Python package in ``python/honba``.
[tool.maturin]
manifest-path = "crates/honba-pyo3/Cargo.toml"
python-source = "python"
module-name = "honba._core"
features = ["pyo3/extension-module"]

# ---------------------------------------------------------------------------
# Architectural boundaries - enforced in CI, not by good intentions.
#
# The SDK is backend-agnostic: strategies and results speak SDK-owned types
# (``honba.strategy.types``) and engines plug in behind ``honba.research.engine``. The
# barter-rs engine (compiled extension ``honba._core``) is reached through exactly one
# module, ``honba.research._barter_adapter``. import-linter only sees ``.py`` modules, so it
# cannot express "only the adapter imports honba._core" directly (the extension resolves to the
# ``honba`` root package, which no contract can forbid); ``tests/test_engine_boundary.py`` scans
# the sources for ``_core`` instead, and the contracts below keep every neutral layer from
# importing an engine module.
#
# Run: ``make lint-imports`` (= ``cd python && lint-imports --config ../pyproject.toml``). It must
# run from ``python/``: from the repo root the tracked legacy top-level ``honba/`` package
# shadows ``python/honba`` and import-linter cannot see the SDK modules.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "honba"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Neutral layers never import an engine implementation"
type = "forbidden"
source_modules = ["honba"]
forbidden_modules = ["honba.research._barter_adapter", "honba.research.simple_engine"]

[[tool.importlinter.contracts]]
name = "Strategy layer is engine-neutral (does not import honba.research)"
type = "forbidden"
source_modules = ["honba.strategy"]
forbidden_modules = ["honba.research"]

[[tool.importlinter.contracts]]
name = "Research layer is engine-free (no nautilus_trader anywhere)"
type = "forbidden"
source_modules = ["honba"]
forbidden_modules = ["nautilus_trader"]

[[tool.importlinter.contracts]]
name = "Research layer does not depend on other honba layers"
type = "forbidden"
source_modules = ["honba.research"]
forbidden_modules = [
    "honba.api",
    "honba.cli",
    "honba.data",
    "honba.strategies",
]

[[tool.importlinter.contracts]]
name = "Data layer is engine-free and sits below the interfaces"
type = "forbidden"
source_modules = ["honba.data"]
forbidden_modules = ["honba.cli", "honba.server", "honba.mcp", "honba.research._barter_adapter"]
